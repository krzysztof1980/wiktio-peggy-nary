buildscript {
    repositories {
        mavenCentral()
        mavenLocal()
    }

    dependencies {
        classpath 'pl.kwitukiewicz:wiktionary-dump-browser:1.0-SNAPSHOT'
    }
}

plugins {
    id 'groovy'
    id 'maven-publish'
}

group = 'wiktiopeggynary'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = 25
    targetCompatibility = 25
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation 'org.dkpro.jwktl:dkpro-jwktl:1.1.0',
            'co.elastic.clients:elasticsearch-java:8.15.1',
            'org.elasticsearch.client:elasticsearch-rest-client:8.15.1',
            'com.fasterxml.jackson.core:jackson-databind:2.20.2',
            'org.apache.commons:commons-lang3:3.4',
            'org.slf4j:slf4j-api:2.0.18',
            'commons-cli:commons-cli:1.3',
            'org.apache.groovy:groovy:4.0.27',
            'pl.kwitukiewicz:wiktionary-dump-browser:1.0-SNAPSHOT'

    runtimeOnly 'ch.qos.logback:logback-classic:1.5.38',
            'org.slf4j:jul-to-slf4j:2.0.18'


    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1',
                'org.apache.groovy:groovy:4.0.27',
                'org.spockframework:spock-core:2.4-groovy-4.0',
                'cglib:cglib-nodep:3.1',
                'org.objenesis:objenesis:2.1'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.1'
}

sourceSets {
    main {
        java { srcDirs = [] }    // no source dirs for the java compiler
        groovy { srcDirs = ["src/main/java", "src/main/groovy"] }  // compile everything in src/ with groovy
    }
}

test {
    useJUnitPlatform()
}


import pl.kwitukiewicz.wdb.elasticsearch.WiktionaryDumpEsRepository

task('updateTestData', dependsOn: [jar]) {
    doLast {
        logger.quiet "Dump file: $dumpFile"
        def testDataDir = file('src/test/resources/articles-de')
        def repo = new WiktionaryDumpEsRepository()
        testDataDir.eachFile { f ->
            def title = (f.name - ".txt").replaceAll("_", " ")
            def entry = repo.findPageById("null:${title}")
            if (entry == null) {
                logger.error("No dictionary entry found for the title '${title}'")
            } else {
                f.setText(entry.text, "UTF-8")
                logger.quiet "Set text of length=${entry.text.length()} in file ${f.name}"
            }
        }
    }
}

task runParser(type: JavaExec) {
    mainClass = 'wiktiopeggynary.WiktiopeggynaryApp'
    classpath = sourceSets.main.runtimeClasspath
    // JDK 25 introduced XML entity-size security limits (defaults in conf/jaxp.properties):
    //   - jdk.xml.maxGeneralEntitySizeLimit (single entity, default 100000) -> JAXP00010003
    //   - jdk.xml.totalEntitySizeLimit      (accumulated total, default 100000) -> JAXP00010004
    // Wiktionary dump pages exceed these, causing SAXParseException. Raise both to 1GB.
    systemProperty 'jdk.xml.maxGeneralEntitySizeLimit', '1073741824'
    systemProperty 'jdk.xml.totalEntitySizeLimit', '1073741824'
    if (project.hasProperty('dumpFile')) {
        args '-f', project.getProperty('dumpFile').toString()
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
