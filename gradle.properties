# The build needs JDK 25 (sourceCompatibility 25 in build.gradle). Do NOT pin
# org.gradle.java.home here: a tracked absolute path works on exactly one machine and
# poisons CI runners and every other clone (they fail with "Java home supplied is
# invalid"). Select the JDK per clone instead — export JAVA_HOME=.../jdk-25 before
# ./gradlew, or choose it in IntelliJ's Gradle JVM setting.
